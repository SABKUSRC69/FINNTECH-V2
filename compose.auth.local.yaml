name: finntech-auth-local
services:
  postgres-auth-local:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finntech_auth_local
      POSTGRES_USER: ui_fixture
      POSTGRES_PASSWORD: ${TRACKER_AUTH_LOCAL_DB_PASSWORD:?Set a synthetic password in .env.auth.local}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - finntech_auth_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ui_fixture -d finntech_auth_local"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  finntech_auth_local_pgdata:
