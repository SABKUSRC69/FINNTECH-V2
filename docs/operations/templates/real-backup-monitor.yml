# REVIEW TEMPLATE ONLY — deliberately outside .github/workflows; never activated here.
# Runs independently of Windows/Render and alerts on a missing/failing receipt.
name: FINNTECH backup receipt watchdog
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Official v4 tag targets verified with git ls-remote on 2026-10-08.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/real-backup-watchdog.mjs
        env:
          FINNTECH_DRIVE_RECEIPT_FILE_ID: ${{ secrets.FINNTECH_DRIVE_RECEIPT_FILE_ID }}
          FINNTECH_DRIVE_CLIENT_ID: ${{ secrets.FINNTECH_DRIVE_CLIENT_ID }}
          FINNTECH_DRIVE_CLIENT_SECRET: ${{ secrets.FINNTECH_DRIVE_CLIENT_SECRET }}
          FINNTECH_DRIVE_REFRESH_TOKEN: ${{ secrets.FINNTECH_DRIVE_REFRESH_TOKEN }}
          FINNTECH_BACKUP_RECEIPT_URL: ${{ secrets.FINNTECH_BACKUP_RECEIPT_URL }}
          FINNTECH_BACKUP_RECEIPT_READ_TOKEN: ${{ secrets.FINNTECH_BACKUP_RECEIPT_READ_TOKEN }}
          FINNTECH_BACKUP_ALERT_EMAIL: ${{ secrets.FINNTECH_BACKUP_ALERT_EMAIL }}
          TRACKER_MAIL_SENDER: ${{ secrets.TRACKER_MAIL_SENDER }}
          TRACKER_MAIL_API_KEY: ${{ secrets.TRACKER_MAIL_API_KEY }}
