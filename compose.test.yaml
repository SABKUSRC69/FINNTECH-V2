name: finntech-f14-test
services:
  postgres-f14-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finntech_tracker_f14_test
      POSTGRES_USER: f14_fixture
      POSTGRES_PASSWORD: ${TRACKER_TEST_DB_PASSWORD:?Set a synthetic local test password in .env.test}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - finntech_f14_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f14_fixture -d finntech_tracker_f14_test"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  finntech_f14_test_pgdata:
