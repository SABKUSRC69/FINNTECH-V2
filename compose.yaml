services:
  tracker-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finntech_tracker
      POSTGRES_USER: tracker_local
      POSTGRES_PASSWORD: local-dev-only-change-me
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - finntech_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_local -d finntech_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finntech_tracker_pgdata:
